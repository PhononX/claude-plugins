<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Notebook</title>
<script>try { var t = localStorage.getItem("cos-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* The notebook page for the Chief of Staff. Built by .cos/build-brain.sh from the notes in cos/;
   the notes are embedded below as text/markdown script elements and rendered here.
   Four views (Today, Open loops, Notebook, History) and one settings page (How it works). */
:root {
  --bg: #F1EFF8;           /* page */
  --surface: #FFFFFF;      /* cards */
  --subtle: #F8F7FC;       /* subtle surface: inputs, inner tiles */
  --ink: #1B1A21;
  --ink2: #3B3848;         /* secondary text */
  --muted: #5D5A6A;
  --line: #E2DEEE;         /* borders */
  --divider: #EEEBF5;      /* rows inside a card */
  --control: #D6D1E6;      /* control borders */
  --dashed: #A9A3BE;
  --accent: #4C35C9;
  --accent-strong: #2F1F96;
  --accent-soft: #ECE8FB;
  --accent-mid: #D9D2F5;
  --accent-fill: #4C35C9;  /* filled buttons, white text */
  --on-fill: #FFFFFF;
  --warm-soft: #FDF0E3; --warm: #7A3E0B;
  --ok-soft: #E5F3EA; --ok: #14532D; --ok-dot: #1E7A46;
  --info-soft: #E6EEFB; --info: #1D4690;
  --danger: #B42318; --danger-soft: #FBE4E1; --danger-ink: #8A1C12;
  --heat-0: #ECE9F5; --heat-1: #D9D2F5; --heat-2: #A897E8; --heat-3: #4C35C9;
  --shadow: rgba(27, 26, 33, 0.06);
  --f-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13111B; --surface: #1C1A26; --subtle: #23202F; --ink: #EEEBF7; --ink2: #D3CEE3; --muted: #A8A2BC;
    --line: #332F45; --divider: #2A2739; --control: #433E5B; --dashed: #645D7E;
    --accent: #B3A5FF; --accent-strong: #D3CAFF; --accent-soft: #2A2352; --accent-mid: #3A2F72; --accent-fill: #5B45D9; --on-fill: #FFFFFF;
    --warm-soft: #3A2716; --warm: #F3C08D; --ok-soft: #16301F; --ok: #8ED6A7; --ok-dot: #4CC777;
    --info-soft: #172A47; --info: #9EC0F5; --danger: #FF8B7B; --danger-soft: #3D1915; --danger-ink: #FFB1A6;
    --heat-0: #262236; --heat-1: #3A2F72; --heat-2: #6A57D6; --heat-3: #B3A5FF; --shadow: rgba(0, 0, 0, 0.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #13111B; --surface: #1C1A26; --subtle: #23202F; --ink: #EEEBF7; --ink2: #D3CEE3; --muted: #A8A2BC;
    --line: #332F45; --divider: #2A2739; --control: #433E5B; --dashed: #645D7E;
    --accent: #B3A5FF; --accent-strong: #D3CAFF; --accent-soft: #2A2352; --accent-mid: #3A2F72; --accent-fill: #5B45D9; --on-fill: #FFFFFF;
    --warm-soft: #3A2716; --warm: #F3C08D; --ok-soft: #16301F; --ok: #8ED6A7; --ok-dot: #4CC777;
    --info-soft: #172A47; --info: #9EC0F5; --danger: #FF8B7B; --danger-soft: #3D1915; --danger-ink: #FFB1A6;
    --heat-0: #262236; --heat-1: #3A2F72; --heat-2: #6A57D6; --heat-3: #B3A5FF; --shadow: rgba(0, 0, 0, 0.35); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); overflow-wrap: break-word; }
a { color: var(--accent); }
a:hover { color: var(--accent-strong); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code { font: 0.9em var(--f-mono); background: var(--subtle); border: 1px solid var(--divider); padding: 0 4px; border-radius: 4px; }
.mono { font-family: var(--f-mono); }
.muted { color: var(--muted); }
.sr { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

/* ---------- header ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 14px max(28px, env(safe-area-inset-right, 0px)) 14px max(28px, env(safe-area-inset-left, 0px));
  border-top: 3px solid transparent; border-image: linear-gradient(90deg, #6C75DD, #967ADE, #BD8DE3) 1 0 0 0; }
.who { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; min-width: 0; }
.badge { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-fill); color: var(--on-fill); display: grid; place-items: center; font-weight: 700; flex: none; }
.who b { display: block; font-weight: 600; font-size: 16px; }
.who small { display: block; font-size: 12px; color: var(--muted); }
.omni { flex: 1 1 360px; max-width: 640px; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border: 1px solid var(--control); border-radius: 10px; background: var(--subtle); }
.omni:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.omni svg { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2; }
.omni input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--ink); }
.omni input::placeholder { color: var(--muted); }
kbd { font: 12px var(--f-mono); color: var(--muted); border: 1px solid var(--control); border-radius: 6px; padding: 2px 6px; }
.top-r { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.next { font-size: 13px; color: var(--muted); white-space: nowrap; }
.next b { color: var(--ink); font-weight: 600; }
.sqbtn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); cursor: pointer; text-decoration: none; flex: none; }
.sqbtn:hover { color: var(--ink); border-color: var(--control); }
.sqbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sqbtn.gem svg { fill: currentColor; stroke: none; }
.backbtn { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--ink); text-decoration: none; }

/* ---------- layout ---------- */
.layout { display: flex; align-items: flex-start; }
nav.side { flex: 0 0 240px; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; }
.nv { display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 14px; border-radius: 10px; color: var(--ink); text-decoration: none; background: none; border: 0; cursor: pointer; width: 100%; text-align: left; font-size: 15px; }
.nv:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); color: var(--ink); }
.nv[aria-current="page"] { background: var(--surface); color: var(--accent); font-weight: 600; box-shadow: 0 1px 2px var(--shadow); }
.nv .n { font: 12px var(--f-mono); color: var(--muted); }
.nv[aria-current="page"] .n { color: var(--accent); }
.nv .n.hot { color: var(--danger); font-weight: 500; }
.side hr { border: 0; height: 1px; background: var(--line); margin: 16px 6px; }
.howlink { display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 10px; color: var(--muted); text-decoration: none; font-size: 14px; }
.howlink:hover { color: var(--ink); }
.howlink[aria-current="page"] { color: var(--accent); font-weight: 600; }
main { flex: 1 1 560px; min-width: 0; padding: 28px 40px 48px 24px; }
.main-in { max-width: 1120px; display: flex; flex-direction: column; gap: 24px; }
body.wide nav.side { display: none; }
body.wide main { padding-left: 40px; }
body.wide .main-in { max-width: 1240px; margin: 0 auto; }

/* ---------- page heading ---------- */
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 16px; }
.ph > div:first-child { min-width: 0; }
.ph h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.ph h1:focus { outline: none; }
.ph .sub { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.ph .sub b { color: var(--ink); font-weight: 600; }
.ph-r { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.files { display: inline-flex; align-items: center; gap: 2px; }
.files .path { font: 12px var(--f-mono); color: var(--muted); margin-right: 4px; overflow-wrap: anywhere; }

/* ---------- cards, rows, labels ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; padding: 18px 22px 12px; }
.card-h h2 { margin: 0; font-size: 17px; font-weight: 600; }
.card-h .cnt { font: 500 13px var(--f-mono); color: var(--accent); }
.card-h .aside { font-size: 13px; color: var(--muted); }
.card-b { padding: 0 22px 18px; }
.lbl { font: 500 11px var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.empty { padding: 14px 16px; color: var(--muted); border: 1px dashed var(--dashed); border-radius: 10px; font-size: 14px; background: var(--subtle); }
.card > .empty { margin: 0 22px 18px; }
.hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.cols2 { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }

/* chips, pills, buttons */
.chip, .tag { display: inline-block; font-size: 12px; line-height: 1.5; padding: 2px 8px; border-radius: 6px; background: var(--bg); color: var(--ink2); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
.c-acc, .tag.acc { background: var(--accent-soft); color: var(--accent-strong); }
.c-warm, .tag.due { background: var(--warm-soft); color: var(--warm); }
.c-info { background: var(--info-soft); color: var(--info); }
.c-ok, .tag.ok { background: var(--ok-soft); color: var(--ok); }
.c-danger, .tag.late { background: var(--danger-soft); color: var(--danger-ink); }
.c-line { background: var(--surface); border: 1px dashed var(--dashed); color: var(--muted); }
.src { display: inline-block; font-size: 12px; line-height: 1.5; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--control); background: var(--surface); color: var(--ink2); white-space: nowrap; text-decoration: none; }
a.src:hover { border-color: var(--accent); color: var(--accent); }
.stat { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; text-decoration: none; color: var(--ink); }
a.stat:hover { border-color: var(--control); color: var(--ink); }
.stat .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--ok-dot); }
.stat.warm .dot { background: #C2620F; } .stat.danger .dot { background: var(--danger); } .stat.info .dot { background: var(--accent); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--control); background: var(--surface); color: var(--ink); font-size: 13px; cursor: pointer; }
.pill:hover { border-color: var(--accent); }
.pill[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.btn { min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--control); background: var(--surface); color: var(--ink); font-size: 13px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
.btn:hover { border-color: var(--accent); color: var(--ink); }
.btn.primary { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-fill); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); color: var(--on-fill); }
.btn.dashed { border-style: dashed; border-color: var(--dashed); }
.btn:disabled { opacity: 0.55; cursor: default; }
@media (pointer: coarse) { .btn, .pill { min-height: 44px; } }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; }

/* avatars */
.av { width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; font: 600 12px var(--f-mono); flex: none; background: var(--accent-soft); color: var(--accent-strong); }
.av.a1 { background: var(--info-soft); color: var(--info); } .av.a2 { background: var(--ok-soft); color: var(--ok); } .av.a3 { background: var(--warm-soft); color: var(--warm); }
.av.lg { width: 52px; height: 52px; font-size: 16px; }
.av.sm { width: 24px; height: 24px; font-size: 10px; }

/* links to notes */
a.wl { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: 3px; }
a.wl:hover { text-decoration-color: var(--accent); }
a.wl.wl-none { text-decoration-style: dashed; }
.url { font: 12.5px var(--f-mono); color: var(--accent); overflow-wrap: anywhere; }

/* list rows (items from the notes) */
.list { list-style: none; margin: 0; padding: 0; }
.list > li { padding: 12px 22px; border-top: 1px solid var(--divider); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; }
.list > li.nobox { grid-template-columns: minmax(0, 1fr); }
.list.flush > li { padding-left: 0; padding-right: 0; }
.list.first-line > li:first-child { border-top: 0; }
.box { width: 18px; height: 18px; border: 1.5px solid var(--muted); border-radius: 4px; margin-top: 2px; position: relative; }
.box.done { background: var(--ok-dot); border-color: var(--ok-dot); }
.box.done::after { content: ""; position: absolute; left: 5px; top: 1px; width: 4px; height: 9px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.num { font: 600 14px var(--f-mono); color: var(--accent); min-width: 18px; text-align: center; margin-top: 1px; }
.txt { min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.quote { margin: 6px 0 0; padding-left: 10px; border-left: 2px solid var(--line); color: var(--muted); font-style: italic; }
.draft { margin-top: 6px; font-size: 13.5px; color: var(--ink2); background: var(--subtle); border: 1px solid var(--divider); border-radius: 8px; padding: 8px 10px; }
.time { font: 13px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.bl-file { font: 12px var(--f-mono); color: var(--muted); }
.overridden { text-decoration: line-through; color: var(--muted); }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
.tscroll { overflow-x: auto; }
table.t th { text-align: left; font: 500 11px var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 11px 14px; border-top: 1px solid var(--divider); vertical-align: top; }
table.t tr.gone td { color: var(--muted); }

/* Today: needs your answer */
.ask-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 22px; border-top: 1px solid var(--divider); }
.ask-row .chip { flex: none; min-width: 70px; text-align: left; }
.ask-txt { flex: 1 1 320px; min-width: 0; }
.ask-t { font-weight: 500; }
.ask-s { font-size: 13px; color: var(--muted); margin-top: 2px; }
.ask-act { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ask-act form { display: flex; gap: 8px; flex: 1 1 320px; min-width: 240px; }
.ask-act input, .loopadd input, .field { flex: 1; min-width: 0; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--control); background: var(--surface); color: var(--ink); }
.ask-act input:focus, .loopadd input:focus, .field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.answered { font-size: 13px; color: var(--muted); }
.ask-foot { display: flex; justify-content: space-between; gap: 8px; padding: 12px 22px; border-top: 1px solid var(--divider); font-size: 13px; color: var(--muted); }

/* Today: schedule */
.tl { position: relative; height: 14px; border-radius: 7px; background: var(--heat-0); margin: 4px 0 6px; overflow: hidden; }
.tl i { position: absolute; top: 0; bottom: 0; background: var(--accent-mid); border-left: 1px solid var(--surface); }
.tl b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--danger); }
.tl-ticks { display: flex; justify-content: space-between; font: 12px var(--f-mono); color: var(--muted); }
.sched { list-style: none; margin: 12px 0 0; padding: 12px 0 0; border-top: 1px solid var(--divider); }
.sched li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 16px; padding: 6px 0; }
.sched .sub { font-size: 13px; color: var(--muted); }
.week { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; margin-top: 10px; }
.wd { background: var(--subtle); border: 1px solid var(--divider); border-radius: 10px; padding: 10px; min-width: 0; text-decoration: none; color: var(--ink); }
.wd .d { display: flex; justify-content: space-between; align-items: center; font: 500 13px var(--f-mono); }
.wd .e { font-size: 12px; color: var(--muted); margin-top: 2px; }
.wd .t { font-size: 13px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #C2620F; }
.pdot.p1 { background: #2F6BD8; } .pdot.p2 { background: #1E7A46; } .pdot.p3 { background: var(--accent); }
.row-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; margin-top: 18px; }
.row-h h3 { margin: 0; font-size: 15px; font-weight: 600; }
.legend { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* small rows with a right-hand figure */
.mini { list-style: none; margin: 0; padding: 0; }
.mini li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--divider); }
.mini li:first-child { border-top: 0; }
.mini .fig { font: 12px var(--f-mono); color: var(--muted); white-space: nowrap; }
.mini .fig.late { color: var(--danger); } .mini .fig.due { color: var(--warm); }
.mini .who2 { font-weight: 600; margin-right: 8px; }
.people { display: grid; gap: 8px; }
.prow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--subtle); text-decoration: none; color: var(--ink); border: 1px solid transparent; }
.prow:hover { border-color: var(--control); color: var(--ink); }
.prow .s { font-size: 13px; color: var(--muted); }
.ppills { display: flex; flex-wrap: wrap; gap: 8px; }
.ppill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink); font-size: 14px; }
.ppill .n { font: 12px var(--f-mono); color: var(--muted); }
.logday { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.logday li { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 4px 12px; padding: 4px 0; }
details.brief { border-top: 1px solid var(--divider); }
details.brief > summary { cursor: pointer; padding: 14px 22px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; list-style: none; font-weight: 600; }
details.brief > summary::-webkit-details-marker { display: none; }
details.brief > summary::before { content: "\25B8"; color: var(--muted); font-size: 12px; }
details.brief[open] > summary::before { content: "\25BE"; }
.brief-body { padding: 0 22px 8px; }
section.block { margin-bottom: 18px; }
section.block > h3, section.block > h4 { font: 500 11px var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
section.block > h3 .aside, section.block > h4 .aside { text-transform: none; letter-spacing: 0; font: 400 12.5px var(--f-body); }
section.block .list { border: 1px solid var(--divider); border-radius: 10px; }
section.block .list > li { padding: 10px 14px; }
section.block .list > li:first-child { border-top: 0; }

    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(c.getAttribute("data-copy")).then(function () { done(true); }, function () { done(false); });

  }
  var a = t.closest('a[href^="#"]');

window.addEventListener("hashchange", function () { if (location.hash !== drawnHash || QUERY) { clearQuery(); route(true); } });
var qEl = $("#q");
qEl.addEventListener("input", function () {

  if (e.key === "Enter" && SRV && QUERY) { e.preventDefault(); tellAgent(QUERY); }

document.addEventListener("keydown", function (e) {

});
document.addEventListener("input", function (e) {
  var id = e.target && e.target.id;
  if (id === "hist-q") { UI.histQ = e.target.value; rerender(); }

/* Refresh every minute while the page is open, so it keeps up with the notes. Skipped while

if (!SRV) setInterval(function () {
  if (document.visibilityState !== "visible" || qEl.value) return;
  var ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  if (window.getSelection && String(window.getSelection())) return;

  location.reload();

window.addEventListener("pagehide", saveSpot);
/* ---------- theme ---------- */
function themeNow() { var t = document.documentElement.getAttribute("data-theme"); return t === "light" || t === "dark" ? t : "auto"; }
function showTheme() { Array.prototype.forEach.call(document.querySelectorAll("[data-theme-set]"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-theme-set") === themeNow())); }); }
document.addEventListener("click", function (e) {
  var b = e.target.closest && e.target.closest("[data-theme-set]"); if (!b) return;
  var t = b.getAttribute("data-theme-set");
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  try { if (t === "auto") localStorage.removeItem("cos-theme"); else localStorage.setItem("cos-theme", t); } catch (err) {}

showTheme();

/* ---------- editing, when the notebook server serves this page ---------- */
var VERSION = null, busy = 0, inlineEdit = null, editorOpen = false, offline = false, toastTimer = null;
function toast(msg, bad) {
  var t = $("#toast"); t.textContent = msg; t.className = bad ? "bad" : ""; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, bad ? 5000 : 2200);
}
function api(method, name, body) {
  var headers = { "X-Notebook-Key": SRV.key };
  if (body) headers["Content-Type"] = "application/json";
  return fetch("/api/" + name, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined, cache: "no-store" }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) { var err = new Error(j.error || "That didn't save. Try again."); err.status = r.status; err.data = j; throw err; }
      offline = false;
      return j;
    });
  }, function () { var err = new Error("Can't reach your notebook. Is your computer's notebook server running? Run ./open-brain.sh to start it."); err.status = 0; throw err; });
}
function reindex() { DOCS = {}; BRIEFS = null; DEFAULTS = null; MENTIONS = null; NOTES = {}; ORDER.forEach(indexNote); }
function loadFiles(files) {
  FILES = {}; ORDER = [];
  Object.keys(files).forEach(function (p) { FILES[p] = String(files[p]).replace(/\r\n?/g, "\n"); ORDER.push(p); });
  reindex();
}
function midEdit() {
  return busy > 0 || !!inlineEdit || editorOpen || Array.prototype.some.call(document.querySelectorAll(".addrow input, #loop-add"), function (i) { return i.value.trim(); });
}
// Redraws the open page with fresh notes, keeping the scroll position, open "Done" lists, search,
// and the box you were typing in.
function rerender() {
  var y = window.scrollY, opened = {};
  Array.prototype.forEach.call(document.querySelectorAll("#main details[open] > summary"), function (s) { opened[s.textContent.replace(/\d+/g, "")] = 1; });
  var ae = document.activeElement, focusId = ae && ae.id && ae.closest && ae.closest("#main") ? ae.id : null, caret = focusId && ae.selectionStart != null ? [ae.selectionStart, ae.selectionEnd] : null;
  render();
  Array.prototype.forEach.call(document.querySelectorAll("#main details > summary"), function (s) { if (opened[s.textContent.replace(/\d+/g, "")]) s.parentNode.open = true; });
  if (focusId) { var f = document.getElementById(focusId); if (f) { f.focus({ preventScroll: true }); if (caret && f.setSelectionRange) try { f.setSelectionRange(caret[0], caret[1]); } catch (e) {} } }
  window.scrollTo(0, y);
}
function refreshNotes() {
  return api("GET", "notes").then(function (j) { VERSION = j.version; if (j.built) META.built = j.built; loadFiles(j.files || {}); rerender(); });
}
function poll() {
  if (!SRV || document.visibilityState !== "visible" || window.cosPausePolling) return;
  api("GET", "version").then(function (j) {
    if (j.version !== VERSION && !midEdit()) return refreshNotes();
  }).catch(function (err) { if (!offline) { offline = true; toast(err.message, true); } });
}
function itemAt(el) {
  var host = el && el.closest ? el.closest("[data-il]") : null; if (!host) return null;
  var d = doc(host.getAttribute("data-ip")), info = d.byLine[+host.getAttribute("data-il")];
  return info && info.item ? info.item : null;
}
function rawLine(it) { return doc(it.path).lines[it.line]; }
var LINE_HEAD = /^(\s*(?:[-*+]|\d+[.)])\s+(?:\[[ xX]\](?:\s+|$))?)/;
function splitLine(raw) {
  var m = raw.match(LINE_HEAD), headPart = m ? m[1] : "", rest = raw.slice(headPart.length);
  var fields = rest.match(FIELD_RE) || [];
  return { head: headPart, fields: fields, sentence: rest.replace(FIELD_RE, " ").replace(/\s+/g, " ").trim() };
}
var PEN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3zM14.5 7.5l2 2"/></svg>';
function enhance() {
  if (!SRV) return;
  Array.prototype.forEach.call(document.querySelectorAll("#main [data-il]"), function (host) {
    var it = itemAt(host); if (!it) return;
    var bx = host.querySelector(".box");
    if (bx && it.checked != null) {
      var cb = document.createElement("input");
      cb.type = "checkbox"; cb.className = "cb"; cb.checked = !!it.checked;
      cb.setAttribute("aria-label", (it.checked ? "Mark not done: " : "Check off: ") + plainText(it.text));
      bx.parentNode.replaceChild(cb, bx);
    }
    var txt = host.querySelector(".txt") || host;
    var pen = document.createElement("button");
    pen.type = "button"; pen.className = "pen"; pen.innerHTML = PEN;
    pen.title = "Edit this line"; pen.setAttribute("aria-label", "Edit: " + plainText(it.text));
    var firstLine = txt.querySelector(":scope > .lt, :scope > .ask-t");
    if (firstLine) { firstLine.appendChild(pen); return; }
    var after = null;
    for (var c = txt.firstChild; c; c = c.nextSibling) { if (c.nodeType === 1 && /\b(meta|quote|draft|hint|ask-s|s)\b/.test(c.className)) { after = c; break; } }
    txt.insertBefore(pen, after);
  });
}
document.addEventListener("change", function (e) {
  var cb = e.target; if (!SRV || !cb.classList || !cb.classList.contains("cb")) return;
  var it = itemAt(cb); if (!it) return;
  var want = cb.checked, txt = cb.closest("[data-il]").querySelector(".txt");
  if (txt) txt.classList.toggle("muted", want);
  busy++;
  api("POST", "toggle", { path: it.path, line: rawLine(it), checked: want }).then(function () {
    busy--; toast(want ? "Checked off" : "Marked not done"); return refreshNotes();
  }).catch(function (err) {
    busy--; cb.checked = !want; if (txt) txt.classList.toggle("muted", !want);
    toast(err.message, true); if (err.status === 409) refreshNotes();
  });
});
function startInline(host) {
  if (inlineEdit) return;
  var it = itemAt(host); if (!it) return;
  var raw = rawLine(it), parts = splitLine(raw), txt = host.querySelector(".txt") || host;
  inlineEdit = { host: host, it: it, raw: raw, parts: parts, txt: txt, html: txt.innerHTML };
  txt.innerHTML = '<input class="inline-edit" type="text" aria-label="Edit this line"><div class="inline-hint">Enter to save · Esc to cancel. The details after it stay as they are.</div>';
  var input = txt.querySelector("input"); input.value = parts.sentence; input.focus(); input.select();
  input.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { e.preventDefault(); cancelInline(); }
    else if (e.key === "Enter") { e.preventDefault(); saveInline(input.value); }
  });
  input.addEventListener("blur", function () { if (inlineEdit && !inlineEdit.saving && input.value.trim() === parts.sentence) cancelInline(); });
}
function cancelInline() { if (!inlineEdit) return; var x = inlineEdit; inlineEdit = null; x.txt.innerHTML = x.html; var p = x.txt.querySelector(".pen"); if (p) p.focus(); }
function saveInline(value) {
  var x = inlineEdit; if (!x || x.saving) return;
  var sentence = value.replace(/\s+/g, " ").trim();
  if (!sentence) { toast("A line can't be empty. To remove it, use Edit the file.", true); return; }
  if (sentence === x.parts.sentence) return cancelInline();
  var newLine = x.parts.head + sentence + (x.parts.fields.length ? " " + x.parts.fields.join(" ") : "");
  x.saving = true;
  api("POST", "replace", { path: x.it.path, line: x.raw, newLine: newLine }).then(function () {
    inlineEdit = null; toast("Saved"); return refreshNotes();
  }).catch(function (err) {
    x.saving = false; toast(err.message, true);
    if (err.status === 409) { inlineEdit = null; refreshNotes(); }
  });
}
document.addEventListener("click", function (e) {
  if (!SRV) return;
  var pen = e.target.closest && e.target.closest(".pen");
  if (pen) { e.preventDefault(); startInline(pen.closest("[data-il]")); return; }
  var eb = e.target.closest && e.target.closest("[data-edit]");
  if (eb) { e.preventDefault(); openEditor(eb.getAttribute("data-edit").split("|").filter(Boolean)); return; }
  var sn = e.target.closest && e.target.closest("[data-start-note]");
  if (sn) {
    var nm = sn.getAttribute("data-start-note").trim();
    if (!nm || /[\/\\:*?"<>|\u0000-\u001f]/.test(nm) || nm.charAt(0) === ".") { toast("That name can't be a file name. Ask " + AGENT + " to start the note instead.", true); return; }
    sn.disabled = true;
    api("POST", "create", { path: "cos/people/" + nm + ".md", content: "---\nrole:\norg:\n---\n# " + nm + "\n" }).then(function () {
      toast("Note started"); return refreshNotes().then(function () { go("people/" + encodeURIComponent(nm)); });
    }).catch(function (err) { sn.disabled = false; toast(err.message, true); if (err.status === 409) refreshNotes(); });
  }
});
document.addEventListener("dblclick", function (e) {
  if (!SRV || !e.target.closest) return;
  if (e.target.closest("a, button, input, textarea, select")) return;
  var host = e.target.closest("[data-il]");
  if (host && e.target.closest(".txt")) { e.preventDefault(); startInline(host); }
});
function addRow(path, section, placeholder) {
  if (!SRV) return "";
  return '<form class="addrow" data-add-path="' + esc(path) + '" data-add-section="' + esc(section || "") + '"><input type="text" placeholder="' + esc(placeholder) +
    '" aria-label="' + esc(placeholder.replace(/,.*$|…$/, "")) + '"><button type="submit">Add</button></form>';
}
document.addEventListener("submit", function (e) {
  var f = e.target; if (!SRV || !f.classList.contains("addrow")) return;
  e.preventDefault();
  var input = f.querySelector("input"), text = input.value.replace(/\s+/g, " ").trim(); if (!text) return;
  busy++;
  api("POST", "add", { path: f.getAttribute("data-add-path"), section: f.getAttribute("data-add-section") || undefined, text: text }).then(function () {
    busy--; input.value = ""; toast(f.getAttribute("data-add-toast") || "Added"); return refreshNotes();
  }).catch(function (err) { busy--; toast(err.message, true); });
});
/* The file editor */
var ED = { path: null, hash: null, conflict: null };
function openEditor(paths) {
  if (!paths.length) return;
  editorOpen = true;
  var el = $("#editor");
  $("#ed-file").innerHTML = paths.length > 1 ? '<select id="ed-pick" aria-label="Which file">' + paths.map(function (p) { return '<option value="' + esc(p) + '">' + esc(p) + "</option>"; }).join("") + "</select>"
    : '<span class="path">' + esc(paths[0]) + "</span>";
  el.hidden = false; document.body.style.overflow = "hidden";
  loadEditor(paths[0]);
  var pick = $("#ed-pick"); if (pick) pick.addEventListener("change", function () { loadEditor(pick.value); });
}
function loadEditor(path) {
  var ta = $("#ed-text"); ta.value = ""; ta.disabled = true; hideConflict();
  api("POST", "file", { path: path }).then(function (j) {
    ED.path = path; ED.hash = j.hash; ta.value = j.content; ta.disabled = false; ta.focus(); ta.setSelectionRange(0, 0); ta.scrollTop = 0;
  }).catch(function (err) { toast(err.message, true); closeEditor(); });
}
function closeEditor() { $("#editor").hidden = true; document.body.style.overflow = ""; editorOpen = false; hideConflict(); var b = $("#main [data-edit]"); if (b) b.focus({ preventScroll: true }); }
function hideConflict() { var c = $("#ed-conflict"); c.hidden = true; c.innerHTML = ""; ED.conflict = null; }
function saveEditor(hash) {
  var btn = $("#ed-save"); btn.disabled = true;
  api("POST", "write", { path: ED.path, content: $("#ed-text").value, hash: hash === undefined ? ED.hash : hash }).then(function (j) {
    btn.disabled = false; ED.hash = j.hash; toast("Saved"); closeEditor(); return refreshNotes();
  }).catch(function (err) {
    btn.disabled = false;
    if (err.status === 409) {
      ED.conflict = err.data || {};
      var c = $("#ed-conflict");
      c.innerHTML = "<p>This note changed while you were editing it.</p>" +
        '<button type="button" class="btn" data-conflict="load">See the new version</button><button type="button" class="btn" data-conflict="keep">Keep mine</button>';
      c.hidden = false;
    } else toast(err.message, true);
  });
}
$("#ed-save").addEventListener("click", function () { saveEditor(); });
$("#ed-cancel").addEventListener("click", closeEditor);
$("#editor").addEventListener("keydown", function (e) {
  if (e.key === "Escape") { e.preventDefault(); closeEditor(); }
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveEditor(); }
});
$("#ed-conflict").addEventListener("click", function (e) {
  var b = e.target.closest && e.target.closest("[data-conflict]"); if (!b || !ED.conflict) return;
  var what = b.getAttribute("data-conflict"), c = $("#ed-conflict");
  if (what === "load") { $("#ed-text").value = ED.conflict.content || ""; ED.hash = ED.conflict.hash; hideConflict(); toast("Showing the new version. Your changes were not saved."); }
  else if (what === "keep") {
    c.innerHTML = "<p>Replace the newer version with yours? What changed in it will be lost.</p>" +
      '<button type="button" class="btn primary" data-conflict="replace">Replace it with mine</button><button type="button" class="btn" data-conflict="back">Back</button>';
  } else if (what === "replace") { var h = ED.conflict.hash; hideConflict(); saveEditor(h); }
  else if (what === "back") {
    c.innerHTML = "<p>This note changed while you were editing it.</p>" +
      '<button type="button" class="btn" data-conflict="load">See the new version</button><button type="button" class="btn" data-conflict="keep">Keep mine</button>';
  }
});

/* ---------- answers, the omnibox, and the Open loops box (edit mode) ---------- */
function stamp() { return TODAY_ISO; }
document.addEventListener("click", function (e) {
  var b = SRV && e.target.closest && e.target.closest("[data-answer]"); if (!b) return;

  busy++;

    busy--; toast("Answered: " + (ANSWER_WORDS[word] || word)); return refreshNotes();
  }).catch(function (err) {

    toast(err.message, true); if (err.status === 409) refreshNotes();

// "Priya owes me the estimate" goes to waiting.md as "[[Priya]]: the estimate"; anything else is
// something you owe, in actions.md under "To do".
function loopTarget(text) {
  var m = text.match(/^\s*\[\[([^\]]+)\]\]\s*:\s*(.+)$/);
  if (m) return { path: "cos/waiting.md", text: "[[" + m[1] + "]]: " + m[2], label: "Owed to you" };
  m = text.match(/^\s*(?:\[\[)?([^\[\]]+?)(?:\]\])?\s+owes\s+(?:me|us)\s+(.+)$/i);
  if (m) {
    var who = m[1].trim(), n = resolve(who), known = mentions()[who.toLowerCase()];
    return { path: "cos/waiting.md", text: "[[" + (n ? n.name : known ? known.name : who) + "]]: " + m[2].trim(), label: "Owed to you" };
  }
  return { path: "cos/actions.md", section: "To do", text: text.replace(/^\s*I\s+(?:owe|need to|have to|must)\s+/i, function () { return ""; }).replace(/^./, function (c) { return c.toUpperCase(); }), label: "You owe" };
}
document.addEventListener("submit", function (e) {

  }).catch(function (err) { busy--; toast(err.message, true); });
});

header();
var saved = null;
try { saved = JSON.parse(sessionStorage.getItem(SKEY) || "null"); } catch (e) { saved = null; }
if (saved && typeof saved.raw === "boolean") RAW = saved.raw;
applyState(readHash()); drawnHash = location.hash;
render();
if (saved && saved.hash === location.hash && saved.y > 0) window.scrollTo(0, saved.y);
else if (state.section) { var tgt = state.view === "how" ? $("#how-" + state.section) : $("#" + state.section); if (tgt) tgt.scrollIntoView(); }
if (SRV) {
