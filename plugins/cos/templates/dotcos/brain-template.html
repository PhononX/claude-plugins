<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* The notebook page for the Chief of Staff. Built by .cos/build-brain.sh from the notes in cos/;
   the notes are embedded below as text/markdown script elements and rendered here.
   Layout: a binder. Section index on the left, one open page on the right; on a phone the index
   becomes a row of tabs. */
:root {
  --bg: #F1F4F2;
  --surface: #FFFFFF;
  --ink: #17201E;
  --muted: #5A6864;
  --line: #D9E0DC;
  --chip: #E8EDEA;
  --accent: #1D5C77;
  --accent-soft: #E0EDF2;
  --due: #8E5600;
  --due-soft: #FAEED6;
  --late: #A23726;
  --late-soft: #F6E0DB;
  --ok: #2B6641;
  --ok-soft: #DFEFE4;
  --obs: #6B4FA0;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101615; --surface: #171F1D; --ink: #E3EAE7; --muted: #92A29D; --line: #283330; --chip: #212B28;
    --accent: #7DB9D3; --accent-soft: #1A3440; --due: #E6B45C; --due-soft: #372B14; --late: #EF8C79; --late-soft: #3B1F1A;
    --ok: #82C79C; --ok-soft: #173123; --obs: #C1A8EC; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); overflow-wrap: break-word; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code { font: 0.9em var(--f-mono); background: var(--chip); padding: 0 4px; border-radius: 4px; }

.top {
  position: sticky; top: 0; z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
}
.top-in { max-width: 1180px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.who { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 280px; }
.mark { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--surface); display: grid; place-items: center; font: 700 16px var(--f-display); flex: none; }
.who h1 { margin: 0; font: 700 19px/1.2 var(--f-display); letter-spacing: -0.01em; }
.who p { margin: 0; color: var(--muted); font-size: 13px; }
.search { flex: 1 1 260px; max-width: 380px; position: relative; }
.search input {
  width: 100%; padding: 8px 12px 8px 34px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); font: 14px var(--f-body);
}
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; }
.notice {
  max-width: 1180px; margin: 14px auto 0; font-size: 13.5px; color: var(--due); background: var(--due-soft);
  border-radius: 8px; padding: 8px 12px;
}
.wrap { padding: 0 max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.shell { max-width: 1180px; margin: 18px auto 0; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; align-items: start; }

nav.index { position: sticky; top: 76px; display: grid; gap: 2px; }
nav.index .grp { font: 500 11px var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 4px; }
nav.index .grp:first-child { padding-top: 0; }
nav.index button {
  display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%;
  text-align: left; background: none; border: 0; border-radius: 7px; padding: 7px 10px; cursor: pointer; font-size: 14px;
}
nav.index button:hover { background: var(--chip); }
nav.index button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav.index .n { font: 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
nav.index button[aria-current="page"] .n { color: var(--accent); }
nav.index .n.hot { color: var(--late); font-weight: 500; }

main { min-width: 0; }
main h2:focus { outline: none; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; margin-bottom: 16px; }
.page-head > div:first-child { min-width: 0; }
.page-head h2 { margin: 0; font: 700 28px/1.15 var(--f-display); letter-spacing: -0.015em; text-wrap: balance; }
.page-head .sub { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.file { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.path { font: 12.5px var(--f-mono); color: var(--muted); background: var(--chip); padding: 3px 8px; border-radius: 6px; overflow-wrap: anywhere; }
.toggle { font-size: 12.5px; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; color: var(--muted); }
.toggle[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.obs { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; cursor: pointer; color: var(--ink); white-space: nowrap; text-decoration: none; }
.obs:hover { border-color: var(--obs); }
.obs svg { width: 15px; height: 15px; fill: var(--obs); }
.obs.small { font-size: 12.5px; padding: 3px 9px; border-radius: 6px; font-weight: 400; color: var(--muted); }
.url { font: 12.5px var(--f-mono); color: var(--accent); overflow-wrap: anywhere; }
.copy { font-size: 12px; background: none; border: 1px solid var(--line); border-radius: 5px; padding: 0 7px; cursor: pointer; color: var(--muted); line-height: 1.7; }
.layer { font: 500 11px var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 7px; border-radius: 5px; }
.layer.you { background: var(--accent-soft); color: var(--accent); }
.layer.learned { background: var(--due-soft); color: var(--due); }
.layer.base { background: var(--chip); color: var(--muted); }
.overridden { text-decoration: line-through; color: var(--muted); }
.rawfile { margin: 0 0 18px; }
.rawfile .path { display: inline-block; margin-bottom: 6px; }
pre.raw {
  margin: 0; padding: 14px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px;
  font: 12.5px/1.6 var(--f-mono); color: var(--ink); overflow-x: auto; white-space: pre; max-height: 70vh;
}

section.block { margin-bottom: 26px; }
section.block > h3, .h3 { font: 600 13px var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
section.block > h3 .aside, .h3 .aside { text-transform: none; letter-spacing: 0; font-family: var(--f-body); font-weight: 400; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.list { list-style: none; margin: 0; padding: 0; }
.list > li { padding: 12px 16px; border-top: 1px solid var(--line); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; }
.list > li:first-child { border-top: 0; }
.list > li.nobox { grid-template-columns: minmax(0, 1fr); }
.box { width: 16px; height: 16px; border: 1.5px solid var(--muted); border-radius: 4px; margin-top: 3px; position: relative; }
.box.done { background: var(--ok); border-color: var(--ok); }
.box.done::after { content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.num { font: 600 15px var(--f-display); color: var(--accent); width: 22px; text-align: center; margin-top: 1px; }
.txt { min-width: 0; }
.muted { color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; align-items: center; }
.tag { font: 12px/1.6 var(--f-body); padding: 0 7px; border-radius: 5px; background: var(--chip); color: var(--muted); max-width: 100%; }
.tag.due { background: var(--due-soft); color: var(--due); font-weight: 500; }
.tag.late { background: var(--late-soft); color: var(--late); font-weight: 500; }
.tag.ok { background: var(--ok-soft); color: var(--ok); font-weight: 500; }
.tag.acc { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.src { font: 11.5px/1.7 var(--f-mono); padding: 0 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; text-decoration: none; }
a.src:hover { border-color: var(--accent); color: var(--accent); }
a.wl { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
a.wl:hover { border-bottom-color: var(--accent); }
.wl-none { border-bottom: 1px dotted var(--muted); cursor: help; }
.quote { margin: 6px 0 0; padding-left: 10px; border-left: 2px solid var(--line); color: var(--muted); font-style: italic; }
.draft { margin-top: 6px; font-size: 13.5px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.hint { font-size: 13px; color: var(--muted); margin: 8px 2px 0; }

.moves { border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-left: 4px solid var(--accent); }
.moves-h { color: var(--accent) !important; }
section.block > h4 { font: 600 13px var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
section.block > h4 .aside { text-transform: none; letter-spacing: 0; font-family: var(--f-body); font-weight: 400; }
.brief-h { font: 700 21px/1.2 var(--f-display); margin: 4px 0 14px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.brief-h .aside { font: 400 14px var(--f-body); color: var(--muted); }
.brief-latest { padding-top: 4px; }
details.brief-old { margin: 0 0 26px; }
details.brief-old > summary { cursor: pointer; padding: 12px 16px; font: 600 16px var(--f-display); }
details.brief-old > summary:hover { color: var(--accent); }
details.brief-old[open] > summary { border-bottom: 1px solid var(--line); }
.brief-body { padding: 16px 16px 0; }
.brief-body section.block { margin-bottom: 18px; }
.asks > li { padding: 8px 16px; }
.dcard { cursor: default; }
.dcard h4 a { color: inherit; text-decoration: none; }
.dcard h4 a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.moved-banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin: 0 0 16px; padding: 12px 16px;
  border-radius: 12px; background: var(--accent-soft); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
.moved-banner p { margin: 0; font-weight: 500; }
.draft-body { background: var(--bg); border-radius: 10px; padding: 14px 16px; margin-bottom: 4px; }
.draft-body > :last-child { margin-bottom: 0; }
ol.slides { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.slide { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.slide-n { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font: 700 15px var(--f-display); }
.slide-b h5 { margin: 5px 0 6px; font: 600 16px/1.3 var(--f-display); }
.slide-notes { margin: 8px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--bg); color: var(--muted); font-size: 13.5px; font-style: italic; }
.slide-notes::before { content: "Speaker notes"; display: block; font: 500 11px var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; font-style: normal; margin-bottom: 2px; }
ul.hist > li { padding: 6px 0; border-top: 0; }
.catch-group { font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 2px 6px; }
.catch-group:first-child { margin-top: 0; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.two > div > section.block:last-child { margin-bottom: 26px; }
.focus { counter-reset: f; }
.focus > li::before { counter-increment: f; content: counter(f); font: 700 20px/1 var(--f-display); color: var(--accent); width: 22px; }
.focus > li { grid-template-columns: 22px minmax(0, 1fr); }
.meet { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 4px 12px; }
.time { font: 500 14px var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); padding-top: 1px; }

.people-grid, .proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.pcard { padding: 14px 16px; text-align: left; cursor: pointer; display: grid; gap: 6px; align-content: start; width: 100%; }
.pcard:hover { border-color: var(--accent); }
.pcard h4 { margin: 0; font: 600 17px/1.25 var(--f-display); }
.pcard .role { color: var(--muted); font-size: 13.5px; margin: 0; }
.pcard .row { display: flex; flex-wrap: wrap; gap: 6px; }
.detail { padding: 18px 20px; margin-bottom: 18px; }
.detail dl { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 6px 14px; margin: 0 0 14px; }
.detail dt { color: var(--muted); font-size: 13.5px; }
.detail dd { margin: 0; min-width: 0; }
.back { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; margin-bottom: 10px; font-size: 14px; }
.backlinks { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.backlinks h4 { font: 600 13px var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 6px 0 4px; }
.backlinks .list > li { padding: 9px 0; }
.bl-file { font: 12px var(--f-mono); color: var(--muted); }

.md { min-width: 0; }
.md > :first-child { margin-top: 0; }
.md h3 { font: 700 20px/1.25 var(--f-display); margin: 16px 0 6px; }
.md h4 { font: 600 13px var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
.md h5 { font: 600 15px var(--f-body); margin: 14px 0 4px; }
.md p { margin: 6px 0; }
.md ul.md-list { list-style: none; margin: 4px 0 8px; padding: 0; }
.md ul.md-list > li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; padding: 4px 0; }
.md .bullet { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); margin: 9px 5px 0; }
.md .num { width: auto; min-width: 16px; font-size: 14px; }
.md blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
.md pre { background: var(--bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font: 12.5px/1.6 var(--f-mono); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }

.ext { padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: start; border-top: 1px solid var(--line); }
.ext:first-child { border-top: 0; }
.ext h4 { margin: 0; font: 600 16px var(--f-display); }

table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
.tscroll { overflow-x: auto; }
table.t th { text-align: left; font: 500 12px var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); padding: 10px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 11px 16px; border-top: 1px solid var(--line); vertical-align: top; min-width: 90px; }
table.t tr:first-child td { border-top: 0; }
table.t tr.gone td { color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--ok); }
.dot.off { background: var(--due); }

.day { padding: 14px 16px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 4px 16px; }
.day:first-child { border-top: 0; }
.day .d { font: 600 15px var(--f-display); }
.day .d small { display: block; font: 12px var(--f-mono); color: var(--muted); }
.day ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.day .time { font-size: 12.5px; color: var(--muted); margin-right: 6px; }

details.done { margin-top: 12px; }
details.done > summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 6px 2px; width: fit-content; }
details.done > .card { margin-top: 6px; }
.grouplink { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.grouplink:hover { color: var(--accent); }

.empty { padding: 22px 16px; text-align: center; color: var(--muted); }
mark { background: var(--due-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
footer { max-width: 1180px; margin: 28px auto 0; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
footer code { overflow-wrap: anywhere; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  nav.index { position: static; display: flex; overflow-x: auto; gap: 4px; padding-bottom: 6px; scrollbar-width: thin; }
  nav.index .grp { display: none; }
  nav.index button { width: auto; flex: none; white-space: nowrap; border: 1px solid var(--line); background: var(--surface); }
  .two { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .top { position: static; }
}
@media (max-width: 520px) {
  .detail { padding: 14px; }
  .detail dl { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .detail dd { margin-bottom: 8px; }
  .day { grid-template-columns: minmax(0, 1fr); }
  .page-head h2 { font-size: 24px; }
  .search { max-width: none; }
  .list > li { padding: 11px 12px; }
  .meet { grid-template-columns: 62px minmax(0, 1fr); }
  /* Your briefs: name, time and days on one line, what it covers below. */
  table.briefs-t thead { display: none; }
  table.briefs-t tr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; border-top: 1px solid var(--line); }
  table.briefs-t tr:first-child { border-top: 0; }
  table.briefs-t td { border-top: 0; min-width: 0; padding: 10px 12px 2px; }
  table.briefs-t td:nth-child(4) { grid-column: 1 / -1; padding-top: 0; padding-bottom: 12px; color: var(--muted); }
}
@media (prefers-reduced-motion: no-preference) {
  main > * { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(3px); } to { transform: none; } }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="who">
      <div class="mark" aria-hidden="true" id="mark"></div>
      <div>
        <h1 id="agent-title">Notebook</h1>
        <p id="byline"></p>
      </div>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false">
    </label>
    <span id="obs-top"></span>
  </div>
</header>

<div class="wrap">
  <div id="notice"></div>
  <div class="shell">
    <nav class="index" id="nav" aria-label="Sections"></nav>
    <main id="main"></main>
  </div>
  <footer id="foot"></footer>
</div>

<!--COS-NOTES-->

<script>
(function () {
"use strict";

/* ---------- the embedded files ---------- */
var FILES = {}, ORDER = [];
Array.prototype.forEach.call(document.querySelectorAll('script[type="text/markdown"][data-path]'), function (s) {
  var p = s.getAttribute("data-path");
  // The builder put a backslash after the "<" of every closing script tag and comment opener; undo both.
  FILES[p] = s.textContent.replace(/<\\(\/script)/gi, "<$1").replace(/<\\(!--)/g, "<$1").replace(/\r\n?/g, "\n");
  ORDER.push(p);
});
var META = {};
try { var mEl = document.getElementById("cos-meta"); if (mEl) META = JSON.parse(mEl.textContent) || {}; } catch (e) { META = {}; }
var AGENT = META.agent || "Your agent";
var OWNER = META.owner || "";
var WS = META.workspace || "";

/* ---------- dates ---------- */
